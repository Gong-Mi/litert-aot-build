name: build-mtk-benchmark

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-mtk-benchmark.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install bazelisk
        run: |
          sudo curl -sL -o /usr/local/bin/bazelisk \
            "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64"
          sudo chmod +x /usr/local/bin/bazelisk
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
          # TF 2.8 WORKSPACE needs bazel 5.x (bazel 6 removed @bazel_tools//platforms)
          echo "USE_BAZEL_VERSION=5.4.1" >> $GITHUB_ENV
          # TF python_configure needs numpy
          python3 -m pip install --user numpy 2>&1 | tail -2 || sudo pip3 install numpy 2>&1 | tail -2
          bazel --version || echo "bazelisk will use USE_BAZEL_VERSION"

      - name: Clone MTK tflite-neuron-delegate
        run: |
          git clone --depth 1 https://github.com/MediaTek-NeuroPilot/tflite-neuron-delegate.git mtkdelegate
          cd mtkdelegate
          cat .bazelversion 2>/dev/null || echo "no .bazelversion"
          cat WORKSPACE | head -30
          # Pin SDK path in WORKSPACE so android_sdk_repository finds our stub
          sed -i 's|    api_level = 28,|    api_level = 28,\n    path = "/opt/android-sdk",|' WORKSPACE
          grep -A3 "name = \"androidsdk\"" WORKSPACE | head -5

      - name: Configure NDK + SDK
        run: |
          # NDK r27: modern bionic symbols compatible with Android 16
          sudo curl -sL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
          sudo mkdir -p /opt/ndk
          sudo unzip -q ndk.zip -d /opt/ndk
          # TF 2.8 toolchain hardcodes aarch64-linux-android-4.9 paths; create the dir with
          # symlinks to llvm tools so bazel5's android_ndk_repository + TF toolchain resolve
          NDK=/opt/ndk/android-ndk-r27
          sudo mkdir -p $NDK/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin
          LLVM=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin
          for t in aarch64-linux-android-gcc aarch64-linux-android-g++ aarch64-linux-android-cpp aarch64-linux-android-ar aarch64-linux-android-ld aarch64-linux-android-strip aarch64-linux-android-objcopy aarch64-linux-android-objdump aarch64-linux-android-nm aarch64-linux-android-as aarch64-linux-android-ranlib aarch64-linux-android-readelf; do
            # map to llvm equivalents: gcc->clang, g++->clang++, ar->llvm-ar, etc
            case "$t" in
              *-gcc) ln_t="aarch64-linux-android24-clang" ;;
              *-g++) ln_t="aarch64-linux-android24-clang++" ;;
              *-cpp) ln_t="aarch64-linux-android24-clang" ;;
              *-as) ln_t="llvm-as" ;;
              *-ar) ln_t="llvm-ar" ;;
              *-ranlib) ln_t="llvm-ranlib" ;;
              *-ld) ln_t="ld.lld" ;;
              *-strip) ln_t="llvm-strip" ;;
              *-objcopy) ln_t="llvm-objcopy" ;;
              *-objdump) ln_t="llvm-objdump" ;;
              *-nm) ln_t="llvm-nm" ;;
              *-readelf) ln_t="llvm-readelf" ;;
              *) ln_t="" ;;
            esac
            if [ -n "$ln_t" ] && [ -e "$LLVM/$ln_t" ]; then
              sudo ln -sf "$LLVM/$ln_t" "$NDK/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin/$t"
            fi
          done
          ls $NDK/toolchains/aarch64-linux-android-4.9/prebuilt/linux-x86_64/bin/ 2>/dev/null | head -12
          # Minimal Android SDK (cmdline-tools only; WORKSPACE android_sdk_repository just needs the path)
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo curl -sL -o /tmp/cmdtools.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
          sudo unzip -q /tmp/cmdtools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest 2>/dev/null || true
          # android_sdk_repository validates platforms/ and build-tools/ exist (bazel5 needs build-tools >= 30.0.0)
          sudo mkdir -p /opt/android-sdk/platforms/android-28
          sudo mkdir -p /opt/android-sdk/build-tools/30.0.0
          # bazel 5 android_ndk_repository validates NDK has platforms/ (old layout)
          sudo mkdir -p /opt/ndk/android-ndk-r27/platforms/android-28
          ls /opt/android-sdk/ 2>/dev/null || echo "sdk dir exists"
          export ANDROID_NDK_HOME=/opt/ndk/android-ndk-r27
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export ANDROID_HOME=/opt/android-sdk
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV

      - name: Build benchmark_model + neuron delegate (android_arm64)
        run: |
          cd mtkdelegate
          export ANDROID_NDK_HOME=/opt/ndk/android-ndk-r27
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          export ANDROID_HOME=/opt/android-sdk
          # Pre-fetch the TF 2.8 archive so bazel doesn't time out resolving it
          echo "Pre-downloading TensorFlow 2.8.0 source..."
          mkdir -p ~/.cache/bazel
          # Let bazel fetch (it has its own cache); give it time
          bazel build --config android_arm64 -c opt \
            //neuron:benchmark_model_plus_neuron_delegate
          echo "=== find outputs ==="
          find bazel-bin -name "benchmark_model*" -type f 2>/dev/null | head -5
          ls -la bazel-bin/neuron/benchmark_model_plus_neuron_delegate 2>/dev/null || true

      - name: Upload benchmark binary
        uses: actions/upload-artifact@v4
        with:
          name: mtk-benchmark-model
          path: mtkdelegate/bazel-bin/neuron/benchmark_model_plus_neuron_delegate
          if-no-files-found: warn
