name: gemma3-1b-quantize-aot

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  quantize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install litert-torch + SDKs + CLI
        run: |
          pip install -U ai-edge-litert-nightly ai-edge-litert-sdk-mediatek-nightly litert-torch-nightly litert-cli-nightly
          python -c "import litert_torch; print('litert_torch OK')"
          litert --help 2>&1 | head -10 || true

      - name: Predownload model (resumable, shared across recipes)
        run: |
          python - <<'EOF'
          from huggingface_hub import snapshot_download
          p = snapshot_download(
              "unsloth/gemma-3-1b-it",
              local_dir="./ckpt",
              max_workers=4,
          )
          print("downloaded to", p)
          EOF
          ls -la ./ckpt/ | head

      - name: Export - dynamic INT8 (default recipe)
        run: |
          python -m litert_torch.generative.export_hf \
            --model ./ckpt \
            --output_dir ./out/dynamic_int8 \
            --quantization_recipe dynamic_wi8_afp32 2>&1 | tail -15
          ls -la ./out/dynamic_int8/ 2>/dev/null

      - name: Export - weight-only INT8
        run: |
          python -m litert_torch.generative.export_hf \
            --model ./ckpt \
            --output_dir ./out/weight_only_int8 \
            --quantization_recipe weight_only_wi8_afp32 2>&1 | tail -15
          ls -la ./out/weight_only_int8/ 2>/dev/null

      - name: Export - weight-only INT4
        run: |
          python -m litert_torch.generative.export_hf \
            --model ./ckpt \
            --output_dir ./out/weight_only_int4 \
            --quantization_recipe weight_only_wi4_afp32 2>&1 | tail -15
          ls -la ./out/weight_only_int4/ 2>/dev/null

      - name: Extract TFLite from litertlm + AOT compile for MT6989
        run: |
          pip install -U litert-lm-builder 2>&1 | tail -1
          mkdir -p out/aot
          python - <<'EOF'
          import io, os
          from litert_lm_builder import litertlm_peek

          variants = ['dynamic_int8', 'weight_only_int8', 'weight_only_int4']
          for v in variants:
              src = f'out/{v}/model.litertlm'
              if not os.path.exists(src):
                  print(f'!! {v}: litertlm not found')
                  continue
              dumpdir = f'out/extracted/{v}'
              os.makedirs(dumpdir, exist_ok=True)
              litertlm_peek.peek_litertlm_file(src, dump_files_dir=dumpdir, output_stream=io.StringIO())
              # find the tflite
              tfl = None
              for r, ds, fs in os.walk(dumpdir):
                  for f in fs:
                      if f.endswith('.tflite'):
                          tfl = os.path.join(r, f)
              if not tfl:
                  print(f'!! {v}: no tflite extracted')
                  continue
              dst = f'out/extracted/{v}/model.tflite'
              os.rename(tfl, dst)
              print(f'{v}: extracted tflite {os.path.getsize(dst)} bytes -> {dst}')
          EOF

      - name: AOT compile each variant for MT6989 (Python API - MediaTek)
        run: |
          for v in dynamic_int8 weight_only_int8 weight_only_int4; do
            tfl="out/extracted/$v/model.tflite"
            if [ ! -f "$tfl" ]; then echo "!! $v: no tflite"; continue; fi
            echo "=== AOT compile $v for MT6989 ==="
            python3 aot_compile_mediatek.py "$tfl" MT6989 || true
            ls -la "out/extracted/$v/_compiled_models/" 2>/dev/null || true
          done
          echo "=== AOT results ==="
          find out/extracted -name "*apply_plugin*" 2>/dev/null | head -10

      - name: Verify AOT bytecode in outputs
        run: |
          python - <<'EOF'
          import os
          for v in ['dynamic_int8', 'weight_only_int8', 'weight_only_int4']:
              d = f'out/extracted/{v}/_compiled_models'
              if not os.path.isdir(d):
                  print(f'{v}: NO OUTPUT DIR {d}')
                  continue
              files = [f for f in os.listdir(d) if f.endswith('.tflite')]
              if not files:
                  print(f'{v}: no tflite in {d} -> {os.listdir(d)}')
                  continue
              p = os.path.join(d, files[0])
              sz = os.path.getsize(p)
              if sz == 0:
                  print(f'{v}: EMPTY FILE {files[0]}')
                  continue
              data = open(p, 'rb').read()
              markers = {s: data.find(s) for s in [b'MT6989', b'NeuroPilot', b'neuron', b'MDLA', b'bytecode']}
              found = {k: v2 for k, v2 in markers.items() if v2 != -1}
              print(f'{v}: {files[0]} {sz} bytes | markers: {found if found else "NONE"}')
          EOF

      - name: Summary
        run: |
          echo "=== all artifacts ==="
          find out -type f \( -name "*.tflite" -o -name "*.litertlm" -o -name "*.task" -o -name "*.bin" \) -exec ls -la {} \; 2>/dev/null
          echo "=== sizes by variant ==="
          du -sh out/*/ 2>/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemma3-1b-variants
          path: out/
