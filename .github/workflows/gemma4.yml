name: gemma4-e2b-quantize-aot

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  quantize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install tools
        run: |
          pip install -U ai-edge-litert-nightly ai-edge-litert-sdk-mediatek-nightly
          pip install -U mediapipe litert-torch-nightly huggingface_hub
          python -c "import mediapipe.tasks.python.genai.converter as c; print('mediapipe converter OK')"

      - name: Download gemma4-e2b checkpoint (safetensors)
        run: |
          huggingface-cli download google/gemma-4-E2B --local-dir ./ckpt 2>&1 | tail -3 || \
          python -c "
          from huggingface_hub import snapshot_download
          p = snapshot_download('google/gemma-4-E2B', local_dir='./ckpt')
          print('downloaded to', p)
          "
          ls -la ./ckpt/ | head -20

      - name: Convert with mediapipe converter - INT4 weight-only (official default)
        run: |
          mkdir -p out
          cat > convert_int4.py <<'EOF'
          from mediapipe.tasks.python.genai import converter
          config = converter.ConversionConfig(
              input_ckpt="./ckpt",
              ckpt_format="safetensors",
              model_type="GEMMA_4_E2B",
              backend="cpu",
              quantize="weight_only_int4",
              output_dir="./out/int4",
          )
          converter.convert_checkpoint(config)
          print("INT4 convert done")
          EOF
          python convert_int4.py 2>&1 | tail -10
          ls -la out/int4/ 2>/dev/null | head

      - name: Convert - INT8 weight-only
        run: |
          cat > convert_int8.py <<'EOF'
          from mediapipe.tasks.python.genai import converter
          config = converter.ConversionConfig(
              input_ckpt="./ckpt",
              ckpt_format="safetensors",
              model_type="GEMMA_4_E2B",
              backend="cpu",
              quantize="weight_only_int8",
              output_dir="./out/int8",
          )
          converter.convert_checkpoint(config)
          print("INT8 convert done")
          EOF
          python convert_int8.py 2>&1 | tail -10
          ls -la out/int8/ 2>/dev/null | head

      - name: Convert - FP16 (no quant)
        run: |
          cat > convert_fp16.py <<'EOF'
          from mediapipe.tasks.python.genai import converter
          config = converter.ConversionConfig(
              input_ckpt="./ckpt",
              ckpt_format="safetensors",
              model_type="GEMMA_4_E2B",
              backend="cpu",
              quantize=None,
              output_dir="./out/fp16",
          )
          converter.convert_checkpoint(config)
          print("FP16 convert done")
          EOF
          python convert_fp16.py 2>&1 | tail -10
          ls -la out/fp16/ 2>/dev/null | head

      - name: List all produced variants
        run: |
          echo "=== all outputs ==="
          find out -type f -exec ls -la {} \; | head -40
          echo "=== sizes ==="
          du -sh out/*/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-e2b-variants
          path: out/
