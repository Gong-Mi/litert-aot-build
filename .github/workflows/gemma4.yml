name: gemma4-e2b-quantize-aot

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  quantize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install litert-torch + SDKs
        run: |
          pip install -U ai-edge-litert-nightly ai-edge-litert-sdk-mediatek-nightly litert-torch-nightly
          python -c "import litert_torch; print('litert_torch OK')"
          python -m litert_torch.generative.export_hf --help 2>&1 | head -50 || true

      - name: Export gemma4-e2b - dynamic INT8 (default recipe)
        run: |
          python -m litert_torch.generative.export_hf \
            --model google/gemma-4-E2B \
            --output_dir ./out/dynamic_int8 \
            --quantization_recipe dynamic_wi8_afp32 \
            --aot_soc_model MT6989 2>&1 | tail -25
          echo "=== output ==="
          find ./out/dynamic_int8 -type f -exec ls -la {} \; 2>/dev/null | head -10

      - name: Export gemma4-e2b - weight-only INT8
        run: |
          python -m litert_torch.generative.export_hf \
            --model google/gemma-4-E2B \
            --output_dir ./out/weight_only_int8 \
            --quantization_recipe weight_only_wi8_afp32 \
            --aot_soc_model MT6989 2>&1 | tail -25
          echo "=== output ==="
          find ./out/weight_only_int8 -type f -exec ls -la {} \; 2>/dev/null | head -10

      - name: Export gemma4-e2b - weight-only INT4
        run: |
          python -m litert_torch.generative.export_hf \
            --model google/gemma-4-E2B \
            --output_dir ./out/weight_only_int4 \
            --quantization_recipe weight_only_wi4_afp32 \
            --aot_soc_model MT6989 2>&1 | tail -25
          echo "=== output ==="
          find ./out/weight_only_int4 -type f -exec ls -la {} \; 2>/dev/null | head -10

      - name: Summary
        run: |
          echo "=== all artifacts ==="
          find out -type f \( -name "*.tflite" -o -name "*.litertlm" -o -name "*.task" -o -name "*.bin" \) -exec ls -la {} \; 2>/dev/null
          echo "=== sizes by variant ==="
          du -sh out/*/ 2>/dev/null

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-e2b-variants
          path: out/
