name: gemma4-e2b-quantize-aot

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  quantize:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install litert CLI + SDKs
        run: |
          pip install -U litert-cli-nightly ai-edge-litert-nightly ai-edge-litert-sdk-mediatek-nightly
          litert --help 2>&1 | head -40
          echo "=== quantize recipes ==="
          litert quantize --help 2>&1 | head -80 || true

      - name: Convert gemma4-e2b from HF (default quant)
        run: |
          # Try converting the HF checkpoint with litert convert (no quant = fp32 baseline too big,
          # so use INT8 dynamic as the safe default first)
          litert convert google/gemma-4-E2B \
            --quantize-recipe dynamic_wi8_afp32 \
            --output ./out/gemma4-e2b_dynamic_int8 2>&1 | tail -30 || true
          ls -laR ./out/ 2>/dev/null | head -40

      - name: Enumerate and run all quantize recipes
        run: |
          mkdir -p out
          # The base model .tflite (converted above, or from official repo if convert produced litertlm)
          BASE=$(find out -name "*.tflite" | head -1)
          echo "BASE=$BASE"
          if [ -z "$BASE" ]; then
            echo "no tflite from convert, listing what we have:"
            find out -type f | head
            exit 1
          fi
          # Run every recipe documented + discovered
          for recipe in dynamic_wi8_afp32 weight_only_wi8_afp32 weight_only_wi4_afp32; do
            echo "=== $recipe ==="
            litert quantize "$BASE" --recipe "$recipe" --output "out/gemma4-e2b_${recipe}.tflite" 2>&1 | tail -8
          done
          ls -la out/

      - name: AOT compile all variants for MT6989
        run: |
          mkdir -p out/aot
          for f in out/gemma4-e2b_*.tflite; do
            [ -f "$f" ] || continue
            base=$(basename "$f" .tflite)
            echo "=== AOT $base for MT6989 ==="
            litert compile "$f" --target mt6989 --output "out/aot/${base}_mt6989.tflite" 2>&1 | tail -12 || true
          done
          ls -laR out/aot/ 2>/dev/null | head -30

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gemma4-e2b-quantized
          path: out/
