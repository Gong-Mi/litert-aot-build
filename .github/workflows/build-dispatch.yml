name: build-mediatek-dispatch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-dispatch.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Install bazelisk
        run: |
          # curl exit 23 = write error; runner user lacks /usr/local/bin perms -> use sudo
          sudo curl -sL -o /usr/local/bin/bazelisk \
            "https://github.com/bazelbuild/bazelisk/releases/download/v1.26.0/bazelisk-linux-amd64"
          sudo chmod +x /usr/local/bin/bazelisk
          sudo ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
          file /usr/local/bin/bazelisk
          bazel --version || echo "bazelisk needs USE_BAZEL_VERSION"

      - name: Clone LiteRT
        run: |
          git clone --depth 1 https://github.com/google-ai-edge/LiteRT.git litert
          cd litert
          cat .bazelversion 2>/dev/null || echo "no .bazelversion"
          ls WORKSPACE 2>/dev/null || true
          grep -rn "android_ndk\|ndk_version\|ndk_r" WORKSPACE .bazelrc 2>/dev/null | head -8 || true

      - name: Configure NDK
        run: |
          cd litert
          # Find required NDK version
          NDK_VER=$(grep -oE "r[0-9]+[a-z]?" WORKSPACE .bazelrc 2>/dev/null | head -1 || echo "r27")
          echo "NDK version hint: $NDK_VER"
          # Download NDK r27 (common default)
          sudo curl -sL -o ndk.zip "https://dl.google.com/android/repository/android-ndk-r27-linux.zip"
          sudo mkdir -p /opt/ndk
          sudo unzip -q ndk.zip -d /opt/ndk
          export ANDROID_NDK_HOME=/opt/ndk/android-ndk-r27
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
          echo "NDK at: $ANDROID_NDK_HOME"

      - name: Build libLiteRt.so + libLiteRtDispatch_MediaTek.so (matched versions)
        run: |
          cd litert
          export ANDROID_NDK_HOME=/opt/ndk/android-ndk-r27
          export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
          bazel build --config=android_arm64 \
            //litert/c:litert_runtime_c_api_so \
            //litert/vendors/mediatek/dispatch:dispatch_api_so \
            2>&1 | tail -30 || true
          echo "=== find outputs ==="
          find bazel-bin -name "libLiteRt*.so" 2>/dev/null | head -10

      - name: Upload dispatch lib
        uses: actions/upload-artifact@v4
        with:
          name: litert-mtk-dispatch
          path: |
            litert/bazel-bin/litert/c/libliteRt.so
            litert/bazel-bin/litert/vendors/mediatek/dispatch/
          if-no-files-found: warn
